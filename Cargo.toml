[package]
name = "pq-studio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unofficial graphical interface for the USGS PHREEQC geochemical engine"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "line_series",
    "point_series",
    "area_series",
    "histogram",
    "full_palette",
    "ab_glyph",
] }
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.101.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
