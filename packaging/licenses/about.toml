# Licence policy for `cargo about` (see packaging/licenses/generate.sh).
# Order is preference when a crate offers a choice ("MIT OR Apache-2.0").
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Include platform-only crates so one file covers the Linux, macOS and
# Windows builds.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
