# Builds the three self-contained packages (each bundles the unmodified USGS
# PHREEQC engine and databases) with the same scripts used locally:
#   Linux   PQ-Studio-<version>-linux-x86_64.tar.gz   packaging/linux/build-linux.sh
#   macOS   PQ-Studio-<version>-macos-universal.dmg   packaging/macos/build-macos.sh
#   Windows PQ-Studio-<version>-windows-x64.zip       packaging/windows/build-windows.ps1
#
# Pushing a tag such as v0.1.0 builds them and publishes a GitHub release
# with the three files. A manual run (Actions -> Release -> Run workflow)
# only builds them; download them from the run's artifacts.
#
# macOS signing is ad hoc unless these optional repository secrets exist:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#     -> Developer ID signing
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_APP_PASSWORD
#     -> notarization (also needs the signing secrets)
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build tarball
        run: packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/out/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Tooling
        run: |
          command -v cmake || brew install cmake
          command -v rustup || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          echo "NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"

      - name: Build dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: packaging/macos/build-macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/out/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup update stable --no-self-update; rustup default stable
      - name: Build zip
        shell: pwsh
        run: ./packaging/windows/build-windows.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/out/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PQ Studio ${GITHUB_REF_NAME#v}" \
            --notes "Download the file for your system; installation steps are in the README."
